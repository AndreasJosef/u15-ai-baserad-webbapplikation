  "What should the history view (listing past Interview sessions —
  transcript + resulting Task Breakdown, per docs/plan.md §10) look
  like and behave like?"

  Plan: three radically different variants, switchable via ?variant=
  (a/b/c), against mocked-up Session/transcript/Task Breakdown data
  matching CONTEXT.md's vocabulary.

  Assumption: this repo has no app scaffold yet (no routes, no task
  runner), so there's no existing page or routing convention to embed
  into (prototype/UI.md's sub-shape A doesn't apply, and sub-shape B's
  "throwaway route under the project's convention" has no convention

  to open in a browser — no build step, no server. Once the real app
  exists, the winning variant gets rebuilt as a real route/component.

  Mock data lives in SESSIONS below — five sessions, one per Phase
  edge case (Defining with no title yet, Drilling, Proposed but not
  confirmed, and two Completed) — see CONTEXT.md for Phase/Session/
  Task Breakdown definitions.
-->

function fmtSessionLabel(s) {
  if (s.projectTitle) return s.projectTitle;
  const firstUserMsg = s.transcript.find(m => m.role === 'user');
  const snippet = firstUserMsg ? firstUserMsg.text.slice(0, 40) + (firstUserMsg.text.length > 40 ? '…' : '') : 'New interview';
  return `Not yet defined: "${snippet}"`;
}

function phaseBadge(phase) {
  return `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full ${PHASE_STYLE[phase]}">${phase}</span>`;
}

function priorityBadge(p) {
  if (!p) return '';
  return `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded ${PRIORITY_STYLE[p]}">${p}</span>`;
}

function transcriptHtml(session, bubbleWidth = 'max-w-[85%]') {
  return session.transcript.map(m => `
    <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}">
      <div class="${bubbleWidth} rounded-2xl px-3 py-2 text-sm ${m.role === 'user' ? 'bg-neutral-900 text-white' : 'bg-neutral-100 text-neutral-800'}">
        ${m.text}
      </div>
    </div>
  `).join('');
}

function breakdownHtml(session) {
  if (!session.breakdown) {
    return `<div class="text-sm text-neutral-500 italic py-6 text-center">No Task Breakdown yet — this Interview hasn't reached the Proposed phase.</div>`;
  }
  const rows = session.breakdown.tasks.map(t => `
    <tr class="border-b border-neutral-100 last:border-0">
      <td class="py-2 pr-3">
        <div class="font-medium text-neutral-900">${t.title}</div>
        ${t.description ? `<div class="text-xs text-neutral-500 mt-0.5">${t.description}</div>` : ''}
      </td>
      <td class="py-2 pr-3 whitespace-nowrap">${priorityBadge(t.priority)}</td>
      <td class="py-2 whitespace-nowrap text-xs text-neutral-500">${t.due || '—'}</td>
    </tr>
  `).join('');
  return `
    <div class="mb-3 flex items-center justify-between">
      <div class="text-sm font-semibold text-neutral-900">📁 ${session.breakdown.projectTitle}</div>
      ${session.todoistProjectId
        ? `<span class="text-xs text-green-700 bg-green-50 border border-green-200 rounded px-2 py-0.5">✓ Created in Todoist</span>`
        : `<span class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-0.5">Awaiting confirmation</span>`}

        <tr class="text-left text-xs text-neutral-400 uppercase tracking-wide">
          <th class="pb-1 font-medium">Task</th>
          <th class="pb-1 font-medium">Priority</th>
          <th class="pb-1 font-medium">Due</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function taskCount(s) {
  return s.breakdown ? s.breakdown.tasks.length : 0;
}

    return `
      <div class="bg-white border border-neutral-200 rounded-xl overflow-hidden">
        <button data-action="toggle" data-id="${s.id}" class="w-full flex items-center justify-between gap-3 px-4 py-3 text-left hover:bg-neutral-50">
          <div class="min-w-0">
            <div class="font-medium text-neutral-900 truncate">${fmtSessionLabel(s)}</div>
            <div class="text-xs text-neutral-500 mt-0.5">${s.createdAt} · ${taskCount(s) ? taskCount(s) + ' tasks' : 'no breakdown yet'}</div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            ${phaseBadge(s.phase)}
            <span class="text-neutral-400 text-sm transition-transform ${isOpen ? 'rotate-180' : ''}">▾</span>
          </div>
        </button>
        ${isOpen ? `
          <div class="border-t border-neutral-100 px-4 py-3">
            ${s.summary ? `<div class="text-sm text-neutral-600 italic mb-3">"${s.summary}"</div>` : ''}
            <div class="flex gap-1 mb-3 bg-neutral-100 p-0.5 rounded-lg w-fit text-sm">
              <button data-action="tab" data-id="${s.id}" data-tab="transcript" class="px-3 py-1 rounded-md ${tab === 'transcript' ? 'bg-white shadow-sm font-medium' : 'text-neutral-500'}">Transcript</button>
              <button data-action="tab" data-id="${s.id}" data-tab="breakdown" class="px-3 py-1 rounded-md ${tab === 'breakdown' ? 'bg-white shadow-sm font-medium' : 'text-neutral-500'}">Task Breakdown</button>

            ${tab === 'transcript'
              ? `<div class="space-y-2 max-h-72 overflow-y-auto pr-1">${transcriptHtml(s)}</div>`
              : `<div>${breakdownHtml(s)}</div>`}
          </div>

      </div>

  },
  onClick(e, rerender) {
    const toggle = e.target.closest('[data-action="toggle"]');

              </div>
            </div>
          `).join('')}
        </div>
      </div>
      ${modalSession ? this.modal(modalSession) : ''}
    `;
  },
  modal(s) {
    const tab = this.state.tab;
    return `
      <div data-action="backdrop" class="fixed inset-0 bg-black/40 flex items-center justify-center p-6 z-40">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden shadow-xl">
          <div class="px-5 py-4 border-b border-neutral-100 flex items-start justify-between">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <h2 class="text-lg font-semibold text-neutral-900">${fmtSessionLabel(s)}</h2>
                ${phaseBadge(s.phase)}
              </div>
              <div class="text-xs text-neutral-400">${s.createdAt}${s.summary ? ` · "${s.summary}"` : ''}</div>
            </div>
            <button data-action="close" class="text-neutral-400 hover:text-neutral-700 text-xl leading-none">×</button>
          </div>
          <div class="flex gap-1 px-5 pt-3 bg-neutral-100/60 border-b border-neutral-100">
            <button data-action="tab" data-tab="transcript" class="px-3 py-1.5 text-sm rounded-t-md ${tab === 'transcript' ? 'bg-white font-medium border border-b-0 border-neutral-200' : 'text-neutral-500'}">Transcript</button>
            <button data-action="tab" data-tab="breakdown" class="px-3 py-1.5 text-sm rounded-t-md ${tab === 'breakdown' ? 'bg-white font-medium border border-b-0 border-neutral-200' : 'text-neutral-500'}">Task Breakdown</button>
          </div>
          <div class="p-5 overflow-y-auto flex-1">
            ${tab === 'transcript'
              ? `<div class="space-y-2">${transcriptHtml(s)}</div>`
              : breakdownHtml(s)}
          </div>
        </div>
      </div>
    `;
  },
  onClick(e, rerender) {
    const open = e.target.closest('[data-action="open"]');
    const close = e.target.closest('[data-action="close"]');
    const backdrop = e.target.closest('[data-action="backdrop"]');
    const tabBtn = e.target.closest('[data-action="tab"]');
    if (open) {
      this.state.modal = open.dataset.id;
      this.state.tab = SESSIONS.find(s => s.id === open.dataset.id).breakdown ? 'breakdown' : 'transcript';
      rerender();
    } else if (close || (backdrop && e.target === backdrop)) {
      this.state.modal = null;
      rerender();
    } else if (tabBtn) {
      this.state.tab = tabBtn.dataset.tab;
      rerender();
    }
  },
};
</script>

<!-- ========================== Switcher + wiring ========================== -->
<script>
const VARIANTS = { a: VariantA, b: VariantB, c: VariantC };
const ORDER = ['a', 'b', 'c'];

function getVariantFromURL() {
  const v = new URLSearchParams(location.search).get('variant');
  return VARIANTS[v] ? v : 'a';
}

let current = getVariantFromURL();

function rerender() {
  const app = document.getElementById('app');
  app.innerHTML = VARIANTS[current].render();
}

function setVariant(v) {
  current = v;
  try {
    const url = new URL(location.href);
    url.searchParams.set('variant', v);
    history.replaceState(null, '', url);
  } catch (err) { /* file:// history API can be finicky in some browsers — non-fatal */ }
  rerender();
  updateSwitcherLabel();
}

function cycle(dir) {
  const idx = ORDER.indexOf(current);
  setVariant(ORDER[(idx + dir + ORDER.length) % ORDER.length]);
}

function updateSwitcherLabel() {
  document.getElementById('switcher-label').textContent =
    `${current.toUpperCase()} — ${VARIANTS[current].name}`;
}

document.getElementById('app').addEventListener('click', (e) => {
  VARIANTS[current].onClick(e, rerender);
});

document.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement.isContentEditable) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});

rerender();
</script>

<div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-neutral-900 text-white rounded-full shadow-lg px-2 py-2">
  <button onclick="cycle(-1)" class="switcher-btn w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center">←</button>
  <span id="switcher-label" class="text-sm font-medium px-1 min-w-[170px] text-center"></span>
  <button onclick="cycle(1)" class="switcher-btn w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center">→</button>
</div>

<script>updateSwitcherLabel();</script>

</body>
</html>
