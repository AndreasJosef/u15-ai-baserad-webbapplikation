name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # NOTE: fails until the app's first scaffolding ticket adds a package.json
      # with `typecheck` and `test` npm scripts. That failure is expected and
      # correct until then — see docs/team-workflow.md §5.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
